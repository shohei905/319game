<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スカイフライト - 塚田淳専用チャレンジ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;900&display=swap');
        
        * {
            box-sizing: border-box;
            /* タップ時のハイライトや、長押しによるコピペ・選択メニューを完全に禁止する */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: none;
        }

        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            z-index: 10;
        }
        .screen.active {
            display: flex;
        }

        /* --- スタート画面・UI --- */
        #start-screen {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        }

        .canvas-container {
            position: relative;
            flex-grow: 1;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .scoreBox {
            background: rgba(255,255,255,0.9);
            padding: 8px 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        /* --- 宝箱・ダブルアップ等のUI --- */
        .btn-shine { position: relative; overflow: hidden; }
        .btn-shine::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

        .chest {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: manipulation;
        }
        .chest:hover { transform: scale(1.1); }
        .chest:active { transform: scale(0.9); }
        .chest.opened {
            transform: scale(1.2);
            filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.8));
        }
        .chest.dimmed {
            opacity: 0.3;
            transform: scale(0.9);
            filter: grayscale(100%);
        }
        .chest-svg { width: 100px; height: 100px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); transition: all 0.3s ease; }

        .log-container {
            max-height: 60dvh;
            overflow-y: auto;
            width: 100%;
            padding-right: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .log-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .loader {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3); border-bottom-color: transparent; border-radius: 50%;
            display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .text-rainbow {
            background: linear-gradient(to right, #ff0000, #ff7f00, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-anim 3s linear infinite;
            background-size: 200% auto;
        }
        @keyframes rainbow-anim {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen active items-center justify-center p-8">
        <div class="z-20 text-center flex flex-col items-center max-w-sm w-full">
            <p class="text-rose-600 font-black text-3xl mb-4 animate-bounce tracking-tighter drop-shadow-md">
                準備はいいか！塚田淳！
            </p>
            <h1 class="text-5xl font-black mb-10 tracking-tighter text-white text-center leading-tight drop-shadow-[0_4px_10px_rgba(0,0,0,0.3)]">
                SKY<br><span class="text-sky-300 text-6xl drop-shadow-[0_4px_10px_rgba(255,255,255,0.8)]">FLIGHT</span>
            </h1>
            
            <button id="start-btn" onclick="startGame()" class="btn-shine w-full bg-blue-500 text-white py-5 rounded-3xl font-black text-2xl shadow-xl active:scale-95 transition-transform mb-4">
                テイクオフ
            </button>

            <button onclick="showLog()" class="w-full bg-white/20 border border-white/40 text-white py-3 rounded-2xl font-bold text-lg shadow-sm active:scale-95 transition backdrop-blur-md">
                <span>共有ログを見る</span>
            </button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
        <div class="canvas-container" id="game-container">
            <canvas id="canvas"></canvas>
            
            <div id="ui" style="position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 10;">
                <div class="scoreBox">
                    <div id="score" style="font-size: 28px; font-weight: bold; color: #333;">残り 200 km</div>
                    <div id="best" style="font-size: 13px; color: #666;">BEST 0 km</div>
                </div>
            </div>

            <!-- スタート案内 -->
            <div id="message" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 20; pointer-events: none;">
                <div style="font-size: 20px; font-weight: bold; color: #444; background: rgba(255,255,255,0.9); padding: 12px 22px; border-radius: 30px; animation: blink 1s infinite alternate; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                    画面を押してテイクオフ
                </div>
            </div>

            <!-- 墜落（ゲームオーバー）画面 -->
            <div id="gameOver" class="hidden absolute inset-0 bg-black/60 z-30 items-center justify-center backdrop-blur-sm">
                <div class="bg-white p-8 rounded-3xl shadow-2xl w-[90%] max-w-[360px] text-center">
                    <h2 class="text-3xl font-black text-gray-800 mb-2">墜落...</h2>
                    <div class="text-gray-500 font-bold text-sm">記録</div>
                    <div id="finalScore" class="text-5xl font-black text-slate-800 my-4">0 km</div>
                    <button id="restartButton" class="btn-shine w-full bg-blue-500 text-white font-bold py-4 rounded-full text-xl shadow-lg active:scale-95 transition-transform mt-2">もう一度飛ぶ</button>
                    <button onclick="backToTitle()" class="w-full bg-slate-100 text-slate-600 font-bold py-3 rounded-full text-lg shadow-sm active:scale-95 transition-transform mt-4">タイトルに戻る</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 宝箱画面 -->
    <div id="treasure-screen" class="screen items-center justify-center p-8 bg-slate-900 text-white">
        <div class="text-center w-full">
            <h2 class="text-4xl font-black text-yellow-400 mb-2 drop-shadow-md">目的地 到達!!</h2>
            <p id="treasure-msg" class="text-slate-300 text-lg mb-12 font-bold italic transition-opacity duration-300">運命の報酬を選べ、塚田淳！</p>
            <div class="flex justify-around items-center w-full max-w-md gap-4 mx-auto" id="chest-container">
                <div class="chest" id="chest-0" onclick="openChest(0)">
                    <svg class="chest-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="10" width="20" height="10" rx="2" fill="#8B4513" stroke="#FBBF24" stroke-width="1.5"/>
                        <path d="M2 10C2 7 5 5 12 5C19 5 22 7 22 10" fill="#A0522D" stroke="#FBBF24" stroke-width="1.5"/>
                        <rect x="10" y="9" width="4" height="3" rx="1" fill="#FBBF24"/>
                    </svg>
                    <p class="mt-2 text-[10px] font-bold text-yellow-500 uppercase tracking-widest drop-shadow-sm chest-label">宝箱 A</p>
                </div>
                <div class="chest" id="chest-1" onclick="openChest(1)">
                    <svg class="chest-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="10" width="20" height="10" rx="2" fill="#8B4513" stroke="#FBBF24" stroke-width="1.5"/>
                        <path d="M2 10C2 7 5 5 12 5C19 5 22 7 22 10" fill="#A0522D" stroke="#FBBF24" stroke-width="1.5"/>
                        <rect x="10" y="9" width="4" height="3" rx="1" fill="#FBBF24"/>
                    </svg>
                    <p class="mt-2 text-[10px] font-bold text-yellow-500 uppercase tracking-widest drop-shadow-sm chest-label">宝箱 B</p>
                </div>
                <div class="chest" id="chest-2" onclick="openChest(2)">
                    <svg class="chest-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="10" width="20" height="10" rx="2" fill="#8B4513" stroke="#FBBF24" stroke-width="1.5"/>
                        <path d="M2 10C2 7 5 5 12 5C19 5 22 7 22 10" fill="#A0522D" stroke="#FBBF24" stroke-width="1.5"/>
                        <rect x="10" y="9" width="4" height="3" rx="1" fill="#FBBF24"/>
                    </svg>
                    <p class="mt-2 text-[10px] font-bold text-yellow-500 uppercase tracking-widest drop-shadow-sm chest-label">宝箱 C</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ダブルアップ画面 -->
    <div id="double-up-screen" class="screen items-center justify-center p-8 bg-slate-900 text-white">
        <div class="text-center w-full">
            <p class="text-rose-500 font-black text-2xl sm:text-3xl mb-4 animate-bounce tracking-tighter">準備はいいか！塚田淳！</p>
            
            <h2 id="double-up-title" class="font-black text-rose-500 mb-6 drop-shadow-md animate-pulse tracking-tighter flex flex-col items-center gap-1">
                <span class="text-3xl sm:text-4xl w-full">ダブルアップチャレンジ</span>
                <span class="text-xl sm:text-2xl text-rose-400 drop-shadow-sm">(1回目)</span>
            </h2>
            
            <p class="text-slate-300 text-lg mb-8 font-bold italic">現在の報酬: <span id="current-reward-text" class="text-3xl text-blue-400 drop-shadow-md">0円</span></p>

            <div id="double-up-actions" class="flex flex-col gap-4 w-full max-w-sm mx-auto">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 mb-2 shadow-lg">
                    <p class="text-cyan-400 font-black text-xl mb-1 tracking-wider drop-shadow-sm">勝率 50%</p>
                    <p class="text-slate-400 text-sm">成功すれば報酬<span class="text-yellow-400 font-bold text-xl ml-1">2倍</span>！<br>失敗すれば<span class="text-rose-500 font-bold">すべて没収</span>。</p>
                </div>
                
                <button onclick="playDoubleUp()" class="btn-shine w-full bg-rose-600 text-white py-4 rounded-3xl font-black text-2xl shadow-[0_4px_15px_rgba(225,29,72,0.4)] active:scale-95 transition-transform">挑戦する</button>
                <button onclick="declineDoubleUp()" class="w-full bg-slate-700 border border-slate-600 text-slate-300 py-3 rounded-2xl font-bold text-lg shadow-sm active:scale-95 transition">やめておく (確定)</button>
            </div>

            <div id="double-up-presentation" class="hidden w-full max-w-sm mx-auto min-h-[200px] flex-col justify-center items-center mt-4">
                <div id="double-up-roulette" class="hidden w-full flex-col items-center justify-center">
                    <p id="roulette-status-text" class="text-slate-400 font-bold mb-4 animate-pulse text-lg">抽選中...</p>
                    <div id="roulette-box" class="w-full bg-slate-800 border-4 border-slate-700 rounded-2xl p-8 text-center transition-colors duration-75 shadow-2xl">
                        <span id="roulette-text" class="text-5xl font-black text-white drop-shadow-md">運命</span>
                    </div>
                </div>
                <div id="double-up-result" class="hidden w-full flex-col items-center justify-center opacity-0 transition-opacity duration-300">
                    <div id="double-up-result-text" class="text-6xl sm:text-7xl font-black transform scale-50 transition-transform duration-500"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- クリア画面 -->
    <div id="clear-screen" class="screen items-center justify-center p-6 bg-slate-900 text-white">
        <div class="text-7xl mb-4 animate-pulse drop-shadow-md">👑</div>
        <h2 class="text-3xl font-black mb-6 text-yellow-400 uppercase tracking-tighter text-center drop-shadow-sm">伝説達成</h2>
        <div class="bg-slate-800 border border-slate-700 rounded-[2.5rem] p-8 w-full max-w-xs mb-8 text-center relative overflow-hidden shadow-2xl">
            <div id="timestamp" class="text-[10px] font-bold text-slate-400 mb-4 uppercase tracking-widest"></div>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mb-2 italic">獲得報酬</p>
            <p id="bonus-value-text" class="text-5xl font-black italic tracking-tighter mb-4 text-white drop-shadow-md">0円</p>
            <div class="border-t border-slate-700 pt-4">
                <p class="text-[10px] text-slate-400 font-bold tracking-wider italic">認定プレイヤー: <span class="text-white font-black">塚田淳</span></p>
            </div>
        </div>
        <p class="text-yellow-400 font-black mb-8 text-center text-xl animate-bounce drop-shadow-sm">最高の記録だ、塚田淳！！</p>
        <button onclick="backToTitle()" class="btn-shine w-full max-w-xs bg-blue-500 py-5 rounded-3xl font-black text-xl text-white shadow-xl active:scale-95 transition">タイトルに戻る</button>
    </div>

    <!-- ログ画面 -->
    <div id="log-screen" class="screen items-center justify-center p-6 bg-slate-900 text-white">
        <h2 class="text-2xl font-black mb-6 text-sky-400 uppercase tracking-tighter text-center italic drop-shadow-sm">共有：栄光の記録</h2>
        <div id="log-list" class="log-container relative z-10">
            <div class="flex justify-center py-10"><span class="loader"></span></div>
        </div>
        <button onclick="backToTitle()" class="mt-8 w-full max-w-xs bg-slate-800 border border-slate-700 text-white py-4 rounded-3xl font-black text-xl shadow-lg active:scale-95 transition relative z-10">戻る</button>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// --- Firebase 設定 ---
const firebaseConfig = {
    apiKey: "AIzaSyD9TtJvfUILwBzsDjXAlZBH5R5Khp1pRzA",
    authDomain: "jungame.firebaseapp.com",
    projectId: "jungame",
    storageBucket: "jungame.firebasestorage.app",
    messagingSenderId: "410177738553",
    appId: "1:410177738553:web:56d7e876c1c7b4333a7ae8",
    measurementId: "G-QGL9HRKVHX"
};
const appIdStr = 'atsushi-flight-challenge'; 
let db, auth;
let currentUser = null;

try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, (user) => { currentUser = user; });
    signInAnonymously(auth);
} catch (err) { console.error("Firebase init failed.", err); }


// --- 画面遷移管理 ---
let currentScreen = 'start';

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    currentScreen = screenId.replace('-screen', '');
}

window.backToTitle = () => {
    switchScreen('start-screen');
    // UIリセット
    document.getElementById('double-up-actions').classList.remove('hidden');
    document.getElementById('double-up-presentation').classList.add('hidden');
    document.getElementById('double-up-roulette').classList.add('hidden');
    document.getElementById('double-up-result').classList.add('hidden');
    document.getElementById('double-up-result').classList.add('opacity-0');
    if (unsubscribeLogs) unsubscribeLogs();
};

window.startGame = () => {
    switchScreen('game-screen');
    // リサイズを適用してゲームをリセット
    resize();
    resetGame();
};


// --- フライトゲームロジック ---
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const gameContainer = document.getElementById("game-container");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const message = document.getElementById("message");
const restartButton = document.getElementById("restartButton");

let width = 0; let height = 0;

function resize() {
    if (currentScreen !== 'game') return;
    const rect = gameContainer.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

let running = false;
let holding = false;
let isCrashed = false; // バグ修正: 墜落中のタップ無効化フラグ

let score = 0;
const CLEAR_SCORE = 200; // ★クリアスコアを200に変更
let best = Number(localStorage.getItem("flightBestKm") || 0);

let player = { x: 160, y: 0, vy: 0, radius: 8 };
let obstacles = [];
let particles = [];
let clouds = [];

let cameraX = 0;
let worldX = 0;
let lastTime = 0;

const gravity = 0.38;
const lift = -0.85;
let speed = 4.0;

bestEl.textContent = "BEST " + best + " km";

function initClouds() {
    clouds = [];
    // 画面サイズがまだ取れていない場合は適当な値を入れる
    const w = width || window.innerWidth;
    const h = height || window.innerHeight;
    for (let i = 0; i < 15; i++) {
        clouds.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: 30 + Math.random() * 60,
            speed: 0.2 + Math.random() * 0.8
        });
    }
}
initClouds(); // 初期化

function updateUI() {
    let remaining = Math.max(0, CLEAR_SCORE - score);
    scoreEl.textContent = "残り " + remaining + " km";
    if (score > best) {
        best = score;
        localStorage.setItem("flightBestKm", best);
        bestEl.textContent = "BEST " + best + " km";
    }
}

function resetGame() {
    score = 0;
    worldX = 0;
    cameraX = 0;
    speed = 4.0;
    
    player.x = 160;
    player.y = height / 2;
    player.vy = 0;
    
    obstacles = [];
    particles = [];
    
    createInitialObstacles();
    updateUI();
    
    running = true;
    isCrashed = false;
    message.style.display = "none";
    document.getElementById("gameOver").classList.add("hidden");
    document.getElementById("gameOver").classList.remove("flex");
}

function createInitialObstacles() {
    obstacles = [];
    let x = 600;
    for (let i = 0; i < 10; i++) {
        createObstacle(x);
        x += 260 + Math.random() * 150;
    }
}

function createObstacle(x) {
    const gapSize = Math.max(130, 250 - score * (120 / CLEAR_SCORE));
    const margin = 90;
    const gapCenter = margin + Math.random() * (height - margin * 2);
    
    obstacles.push({
        x: x,
        width: 60,
        gapCenter: gapCenter,
        gapSize: gapSize,
        passed: false,
        color: Math.random() > 0.5 ? "#2c3e50" : "#34495e"
    });
}

function spawnObstacle() {
    const last = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : worldX + 500;
    createObstacle(last + 260 + Math.random() * 150);
}

function updateGame(dt) {
    const delta = dt / 16.666;
    
    // バグ修正: 雲とパーティクルはゲームオーバー後も常に動かす
    updateParticles(delta);
    for (let c of clouds) {
        // runningがfalseの場合はデフォルトの速度(1.0)で動かす
        c.x -= c.speed * (running ? speed : 1.0) * 0.2 * delta;
        if (c.x + c.size < 0) {
            c.x = width + c.size;
            c.y = Math.random() * height;
        }
    }
    
    if (!running) return;
    
    /* プレイヤーの移動 */
    if (holding) {
        player.vy += lift * delta;
    } else {
        player.vy += gravity * delta;
    }
    
    player.vy *= Math.pow(0.98, delta);
    player.y += player.vy * delta;
    
    /* スピードと進行 */
    worldX += speed * delta;
    speed += 0.0015 * delta;
    
    /* 飛行機の煙 */
    if (Math.random() < 0.6) {
        particles.push({
            x: player.x - 15, y: player.y,
            vx: -speed * 0.8 + (Math.random() - 0.5), vy: (Math.random() - 0.5) * 0.5,
            life: 1, type: 'smoke'
        });
    }
    
    /* 障害物生成・削除 */
    while (obstacles.length === 0 || obstacles[obstacles.length - 1].x < worldX + width + 500) {
        spawnObstacle();
    }
    obstacles = obstacles.filter(o => o.x > worldX - 200);
    
    /* 当たり判定 */
    for (const o of obstacles) {
        const screenX = o.x - worldX + player.x;
        
        if (player.x + player.radius > screenX && player.x - player.radius < screenX + o.width) {
            const gapTop = o.gapCenter - o.gapSize / 2;
            const gapBottom = o.gapCenter + o.gapSize / 2;
            if (player.y - player.radius < gapTop || player.y + player.radius > gapBottom) {
                createExplosion(player.x, player.y);
                endGame(false);
                return;
            }
        }
        
        if (!o.passed && screenX + o.width < player.x) {
            o.passed = true;
            score++;
            updateUI();
            
            for(let i=0; i<5; i++) {
                particles.push({
                    x: player.x, y: player.y,
                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                    life: 1, type: 'star'
                });
            }
            
            if (score >= CLEAR_SCORE) {
                endGame(true);
                return;
            }
        }
    }
    
    /* 画面外落下・天井激突 */
    if (player.y < -20 || player.y > height + 20) {
        createExplosion(player.x, player.y);
        endGame(false);
    }
}

function createExplosion(x, y) {
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
            life: 1, type: 'explosion'
        });
    }
}

function updateParticles(delta) {
    particles.forEach(p => {
        p.x += p.vx * delta;
        p.y += p.vy * delta;
        if (p.type === 'smoke') p.life -= 0.03 * delta;
        else if (p.type === 'star') p.life -= 0.05 * delta;
        else if (p.type === 'explosion') p.life -= 0.02 * delta;
    });
    particles = particles.filter(p => p.life > 0);
}

function endGame(isClear) {
    running = false;
    holding = false;
    isCrashed = true; // バグ修正: ここでフラグを立てて直後のタップを無効にする
    
    if (score > best) {
        best = score;
        localStorage.setItem("flightBestKm", best);
        bestEl.textContent = "BEST " + best + " km";
    }
    
    if (isClear) {
        // クリア時は少し余韻を残して即宝箱へ
        setTimeout(prepareTreasure, 500); 
    } else {
        document.getElementById("finalScore").textContent = score + " km";
        setTimeout(() => {
            document.getElementById("gameOver").classList.remove("hidden");
            document.getElementById("gameOver").classList.add("flex");
        }, 500);
    }
}

function drawBackground() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    for (let c of clouds) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.5, c.y - c.size * 0.2, c.size * 0.8, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.8, c.y, c.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawObstacles() {
    for (const o of obstacles) {
        const x = o.x - worldX + player.x;
        const gapTop = o.gapCenter - o.gapSize / 2;
        const gapBottom = o.gapCenter + o.gapSize / 2;
        ctx.fillStyle = o.color;
        ctx.fillRect(x, 0, o.width, gapTop);
        ctx.fillRect(x, gapBottom, o.width, height - gapBottom);
        
        ctx.fillStyle = "rgba(241, 196, 15, 0.6)";
        const windowSize = 8, margin = 8;
        for (let wy = 20; wy < gapTop - 15; wy += 25) {
            ctx.fillRect(x + margin, wy, windowSize, windowSize);
            ctx.fillRect(x + o.width - margin - windowSize, wy, windowSize, windowSize);
        }
        for (let wy = gapBottom + 20; wy < height - 15; wy += 25) {
            ctx.fillRect(x + margin, wy, windowSize, windowSize);
            ctx.fillRect(x + o.width - margin - windowSize, wy, windowSize, windowSize);
        }
    }
}

function drawAirplane() {
    ctx.save();
    ctx.translate(player.x, player.y);
    const angle = Math.min(Math.max(player.vy * 0.08, -Math.PI / 4), Math.PI / 4);
    ctx.rotate(angle);
    
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath(); ctx.moveTo(-10, -3); ctx.lineTo(-18, -12); ctx.lineTo(-18, 0); ctx.fill();
    
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = "#85c1e9";
    ctx.beginPath(); ctx.arc(10, -2, 3, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = "#bdc3c7";
    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(-6, 14); ctx.lineTo(6, 14); ctx.fill();
    
    ctx.restore();
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        if (p.type === 'smoke') {
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, 3 + (1 - p.life) * 5, 0, Math.PI * 2); ctx.fill();
        } else if (p.type === 'star') {
            ctx.fillStyle = "#f1c40f"; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        } else if (p.type === 'explosion') {
            ctx.fillStyle = Math.random() > 0.5 ? "#e74c3c" : "#f39c12"; ctx.beginPath(); ctx.arc(p.x, p.y, 2 + Math.random() * 3, 0, Math.PI * 2); ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

function drawGame() {
    drawBackground();
    drawObstacles();
    drawParticles();
    // 墜落していない時、もしくはクリアした時は飛行機を描画
    if (running || (!running && !isCrashed && score >= CLEAR_SCORE)) {
        drawAirplane();
    }
}

/* 入力イベント (バグ修正済み) */
function startHold(e) {
    if (e.target.closest('button')) return; 
    e.preventDefault();
    holding = true;
    // 墜落後(isCrashed===true)はタップしてもリスタートしない
    if (currentScreen === 'game' && !running && !isCrashed) {
        resetGame();
    }
}
function endHold(e) { e.preventDefault(); holding = false; }

gameContainer.addEventListener("pointerdown", startHold);
gameContainer.addEventListener("pointerup", endHold);
gameContainer.addEventListener("pointercancel", endHold);
gameContainer.addEventListener("pointerleave", endHold);

document.addEventListener("keydown", e => {
    if (currentScreen !== 'game') return;
    if (e.code === "Space" || e.code === "ArrowUp") {
        holding = true;
        if (!running && !isCrashed) resetGame();
        e.preventDefault();
    }
});
document.addEventListener("keyup", e => {
    if (currentScreen !== 'game') return;
    if (e.code === "Space" || e.code === "ArrowUp") {
        holding = false; e.preventDefault();
    }
});

restartButton.addEventListener("click", e => { e.stopPropagation(); resetGame(); });

// メインループ
function loop(time) {
    if (!lastTime) lastTime = time;
    const dt = Math.min(time - lastTime, 40);
    lastTime = time;
    
    if (currentScreen === 'game') {
        updateGame(dt);
        drawGame();
    }
    requestAnimationFrame(loop);
}


// --- 宝箱・ダブルアップ等のロジック ---
let chestValues = [];
let isChestOpened = false;
let currentReward = 0; 
let doubleUpCount = 0;

function getRewardColorClass(reward) {
    if (reward === 0) return { class: 'text-slate-500', shadow: 'none' };
    if (reward === 1500) return { class: 'text-sky-400', shadow: 'drop-shadow-[0_0_8px_rgba(56,189,248,0.6)]' }; 
    if (reward === 2500) return { class: 'text-blue-500', shadow: 'drop-shadow-[0_0_10px_rgba(59,130,246,0.6)]' }; 
    if (reward === 3000) return { class: 'text-indigo-500 font-black', shadow: 'drop-shadow-[0_0_12px_rgba(99,102,241,0.6)]' }; 
    if (reward === 3500) return { class: 'text-purple-500 font-black', shadow: 'drop-shadow-[0_0_12px_rgba(168,85,247,0.6)]' }; 
    if (reward === 5000) return { class: 'text-fuchsia-500 font-black', shadow: 'drop-shadow-[0_0_15px_rgba(217,70,239,0.7)]' }; 
    if (reward === 6000) return { class: 'text-orange-500 font-black', shadow: 'drop-shadow-[0_0_15px_rgba(249,115,22,0.8)]' }; 
    if (reward === 7000) return { class: 'text-red-500 font-black animate-pulse', shadow: 'drop-shadow-[0_0_20px_rgba(239,68,68,0.8)]' }; 
    if (reward === 10000) return { class: 'text-rose-600 font-black animate-pulse', shadow: 'drop-shadow-[0_0_20px_rgba(225,29,72,0.9)]' }; 
    if (reward >= 14000) return { class: 'text-rainbow font-black', shadow: 'shadow-rainbow' }; 
    return { class: 'text-white', shadow: 'none' };
}

function updateRewardDisplay(elId, amount) {
    const el = document.getElementById(elId);
    const styleInfo = getRewardColorClass(amount);
    el.innerText = `${amount.toLocaleString()}円`;
    el.className = `text-3xl transition-all duration-500 ${styleInfo.class} ${styleInfo.shadow}`;
}

window.prepareTreasure = () => {
    isChestOpened = false;
    switchScreen('treasure-screen');
    
    const chests = document.querySelectorAll('.chest');
    const labels = ['宝箱 A', '宝箱 B', '宝箱 C'];
    chests.forEach((chest, index) => {
        chest.classList.remove('opened', 'dimmed');
        const label = chest.querySelector('.chest-label');
        if (label) label.innerText = labels[index];
    });
    document.getElementById('treasure-msg').innerText = "運命の報酬を選べ、塚田淳！";
    
    let array = [1500, 2500, 3500];
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    chestValues = array;
};

window.openChest = (index) => {
    if (isChestOpened) return;
    isChestOpened = true; 
    currentReward = chestValues[index];
    
    const chests = document.querySelectorAll('.chest');
    chests.forEach((chest, i) => {
        if (i === index) {
            chest.classList.add('opened');
            const label = chest.querySelector('.chest-label');
            if(label) label.innerText = `${currentReward}円`;
        } else {
            chest.classList.add('dimmed');
        }
    });
    document.getElementById('treasure-msg').innerText = "運命の扉が開かれた...！";
    
    setTimeout(() => {
        doubleUpCount = 0;
        document.getElementById('double-up-title').innerHTML = `
            <span class="text-3xl sm:text-4xl w-full">ダブルアップチャレンジ</span>
            <span class="text-xl sm:text-2xl text-rose-400 drop-shadow-sm">(1回目)</span>
        `;
        updateRewardDisplay('current-reward-text', currentReward);
        switchScreen('double-up-screen');
        
        const statusText = document.getElementById('roulette-status-text');
        if(statusText) {
            statusText.innerText = "抽選中...";
            statusText.className = "text-slate-400 font-bold mb-4 animate-pulse text-lg";
        }
    }, 1500);
};

window.playDoubleUp = () => {
    document.getElementById('double-up-actions').classList.add('hidden');
    document.getElementById('double-up-presentation').classList.remove('hidden');
    document.getElementById('double-up-presentation').classList.add('flex');
    document.getElementById('double-up-roulette').classList.remove('hidden');
    document.getElementById('double-up-roulette').classList.add('flex');
    
    const rBox = document.getElementById('roulette-box');
    const rText = document.getElementById('roulette-text');
    const statusText = document.getElementById('roulette-status-text');
    
    statusText.innerText = "抽選中...";
    statusText.className = "text-slate-400 font-bold mb-4 animate-pulse text-lg";
    
    const duration = 8000; 
    const startTime = Date.now();
    let ticks = 0;
    const isWin = Math.random() < 0.5;
    
    function runRoulette() {
        const elapsed = Date.now() - startTime;
        ticks++;
        
        if (ticks % 2 === 0) {
            rBox.className = "w-full bg-rose-900/50 border-4 border-rose-500 rounded-2xl p-8 text-center shadow-[0_4px_15px_rgba(244,63,94,0.3)]";
            rText.innerText = "成功！？";
            rText.className = "text-5xl font-black text-rose-400 drop-shadow-md";
        } else {
            rBox.className = "w-full bg-blue-900/50 border-4 border-blue-500 rounded-2xl p-8 text-center shadow-[0_4px_15px_rgba(59,130,246,0.3)]";
            rText.innerText = "失敗！？";
            rText.className = "text-5xl font-black text-blue-400 drop-shadow-md";
        }
        
        if (elapsed > 2000 && elapsed <= 4000) {
            statusText.innerText = "まだまだ！";
            statusText.className = "text-amber-400 font-bold mb-4 animate-pulse text-xl drop-shadow-sm";
        } else if (elapsed > 4000 && elapsed <= 5500) {
            statusText.innerText = "どっちだ！？";
            statusText.className = "text-orange-400 font-black mb-4 animate-bounce text-2xl drop-shadow-sm";
        } else if (elapsed > 5500 && elapsed <= 7000) {
            statusText.innerText = "決まるぞ！ジュン！";
            statusText.className = "text-rose-400 font-black mb-4 animate-ping text-3xl drop-shadow-sm";
        } else if (elapsed > 7000) {
            statusText.innerText = "どっちだ！？淳！！！！";
            statusText.className = "text-red-500 font-black mb-4 animate-ping text-4xl drop-shadow-lg";
        }
        
        if (elapsed >= duration) {
            showDoubleUpResult(isWin);
        } else {
            const progress = elapsed / duration;
            const delay = 50 + (progress * progress) * 350; 
            setTimeout(runRoulette, delay);
        }
    }
    setTimeout(runRoulette, 50);
};

function showDoubleUpResult(isWin) {
    const resEl = document.getElementById('double-up-result');
    const resText = document.getElementById('double-up-result-text');
    
    document.getElementById('double-up-roulette').classList.add('hidden');
    document.getElementById('double-up-roulette').classList.remove('flex');
    resEl.classList.remove('hidden');
    resEl.classList.add('flex');
    
    setTimeout(() => resEl.classList.remove('opacity-0'), 50);
    
    if (isWin) {
        currentReward *= 2;
        doubleUpCount++;
        
        resText.innerText = "成功！！";
        resText.className = "text-6xl sm:text-7xl font-black text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)] transform scale-110 transition-transform duration-500";
        
        setTimeout(() => {
            updateRewardDisplay('current-reward-text', currentReward);
            setTimeout(() => {
                resEl.classList.add('opacity-0');
                setTimeout(() => {
                    if (doubleUpCount < 2) {
                        document.getElementById('double-up-title').innerHTML = `
                            <span class="text-3xl sm:text-4xl w-full">ダブルアップチャレンジ</span>
                            <span class="text-xl sm:text-2xl text-rose-400 drop-shadow-sm">(2回目)</span>
                        `;
                        document.getElementById('double-up-actions').classList.remove('hidden');
                        resEl.classList.add('hidden');
                        resEl.classList.remove('flex');
                        document.getElementById('double-up-presentation').classList.add('hidden');
                        document.getElementById('double-up-presentation').classList.remove('flex');
                    } else {
                        finishGame();
                    }
                }, 300);
            }, 1200); 
        }, 1000); 
    } else {
        currentReward = 0;
        resText.innerText = "失敗...";
        resText.className = "text-6xl sm:text-7xl font-black text-slate-500 drop-shadow-md transform scale-100 transition-transform duration-500";
        
        setTimeout(() => {
            updateRewardDisplay('current-reward-text', currentReward);
            setTimeout(() => {
                resEl.classList.add('opacity-0');
                setTimeout(() => finishGame(), 300);
            }, 1200); 
        }, 1000); 
    }
}

window.declineDoubleUp = () => finishGame();

function finishGame() {
    const bonusTextEl = document.getElementById('bonus-value-text');
    const styleInfo = getRewardColorClass(currentReward);
    
    bonusTextEl.innerText = `${currentReward.toLocaleString()}円`;
    bonusTextEl.className = `text-6xl italic tracking-tighter mb-4 transition-all duration-1000 ${styleInfo.class} ${styleInfo.shadow}`;
    
    const now = new Date();
    const dateStr = now.getFullYear() + '/' + ('0' + (now.getMonth() + 1)).slice(-2) + '/' + ('0' + now.getDate()).slice(-2);
    const timeStr = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2) + ':' + ('0' + now.getSeconds()).slice(-2);
    document.getElementById('timestamp').innerText = `${dateStr} ${timeStr}`;
    
    switchScreen('clear-screen');
    
    // Firebaseにログを保存
    if (db && currentUser) {
        const logCol = collection(db, 'artifacts', appIdStr, 'public', 'data', 'logs');
        addDoc(logCol, { 
            date: dateStr, time: timeStr, reward: currentReward, 
            timestamp: serverTimestamp(), localTime: Date.now() 
        }).catch(e => console.error(e));
    }
}


// --- ログ共有機能 ---
let unsubscribeLogs = null;
window.showLog = async () => {
    switchScreen('log-screen');
    const listEl = document.getElementById('log-list');
    
    if (!db) {
        listEl.innerHTML = '<p class="text-white text-center py-8">接続エラー</p>';
        return;
    }
    
    if (!currentUser && auth) {
        try {
            const userCred = await signInAnonymously(auth);
            currentUser = userCred.user;
        } catch(e) {
            listEl.innerHTML = '<p class="text-white text-center py-8">認証エラー</p>';
            return;
        }
    }
    
    if (unsubscribeLogs) unsubscribeLogs();
    const logCol = collection(db, 'artifacts', appIdStr, 'public', 'data', 'logs');
    unsubscribeLogs = onSnapshot(logCol, (snap) => {
        const logs = snap.docs.map(d => d.data()).sort((a, b) => {
            const timeA = a.localTime || (a.timestamp?.seconds * 1000) || 0;
            const timeB = b.localTime || (b.timestamp?.seconds * 1000) || 0;
            return timeB - timeA;
        });
        
        if (logs.length === 0) { listEl.innerHTML = '<p class="text-slate-400 text-center py-8">記録なし</p>'; return; }
        
        listEl.innerHTML = logs.map(l => {
            const styleInfo = getRewardColorClass(l.reward || 0);
            const formattedReward = `${(l.reward || 0).toLocaleString()}円`;
            return `
            <div class="log-item">
                <div>
                    <div class="text-[10px] text-slate-400">${l.date} ${l.time}</div>
                    <div class="text-xs text-sky-400 font-black drop-shadow-sm">CLEARED</div>
                </div>
                <div class="text-2xl font-black italic ${styleInfo.class} ${styleInfo.shadow}">${formattedReward}</div>
            </div>`;
        }).join('');
    });
};

requestAnimationFrame(loop);
</script>
